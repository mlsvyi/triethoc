const data=[{"n":1,"q":"Chủ nghĩa Mác nói chung, triết học Mác nói riêng ra đời vào những năm nào của thế kỷ XIX?","options":["Những năm 30 của thế kỷ XIX.","Những năm 40 của thế kỷ XIX","Những năm 50 của thế kỷ XIX.","Những năm 20 của thế kỷ XIX."],"answer":1,"certainty":"pdf_highlight"},{"n":2,"q":"Quan điểm cho rằng: mọi sự vật, hiện tượng chỉ là “phức hợp những cảm giác” của con người, của chủ thể nhận thức là quan điểm thể hiện lập trường triết học nào?","options":["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"answer":0,"certainty":"pdf_highlight"},{"n":3,"q":"Hãy cho biết, trong những vấn đề dưới đây, việc giải quyết vấn đề nào sẽ là tiêu chuẩn để xác định lập trường thế giới quan của các triết gia và học thuyết của họ:","options":["Vấn đề giai cấp","Vấn đề con người","Vấn đề dân tộc","Vấn đề cơ bản của triết học"],"answer":3,"certainty":"pdf_highlight"},{"n":4,"q":"Tại sao chủ nghĩa Mác nói chung, triết học Mác nói riêng ra đời là tất yếu khách quan?","options":["Do có những tiền để khách quan quy định.","Do có những điêu kiện, tiền đề khách quan và chủ quan chín muỗi quy định.","Do có những tiễn để chủ quan quy định.","Do có những tiền đề khoa học quy định."],"answer":1,"certainty":"pdf_highlight"},{"n":5,"q":"Hãy chỉ ra quan niệm đầy đủ, đúng đắn về triết học:","options":["Hệ thống tri thức về kinh tế và chính trị.","Hệ thống trị thức lý luận chung nhất về thế giới và vị trí, vai trò của con người trong thế giới ấy.","Nghệ thuật tranh luận.","Khoa học của mọi khoa học"],"answer":1,"certainty":"pdf_highlight"},{"n":6,"q":"Nguồn gốc của sự ra đời triết học là:","options":["Nguồn gốc nhận thức","Nguồn gốc nhận thức và nguồn gốc tự nhiên","Nguồn gốc xã hội","Nguồn gốc nhận thức và nguồn gốc xã hội."],"answer":3,"certainty":"pdf_highlight"},{"n":7,"q":"Đối tượng nghiên cứu của triết học Mác - Lênin là:","options":["Những quy luật kinh tế.","Những quy luật quy luật xã hội.","Những quy luật chung nhất của tự nhiên, xã hội và tư duy.bât","Những quy luật chính trị - xã hội."],"answer":2,"certainty":"pdf_highlight"},{"n":8,"q":"Hình thức cơ bản của phép biện chứng trong lịch sử là:","options":["Phép biện chứng mộc mạc chất phác cổ đại.","Phép biện chứng duy tâm cổ điển Đức.","Phép biện chứng duy vật.","Cả A, B và C."],"answer":3,"certainty":"pdf_highlight"},{"n":9,"q":"Ba hình thức cơ bản của chủ nghĩa duy vật trong lịch sử là:","options":["Chủ nghĩa duy vật mộc mạc, chất phác cổ đại; Chủ nghĩa duy kinh tế, Chủ nghĩa duy vật tâm thường.","Chủ nghĩa duy vật mộc mạc, chất phác cổ đại; Chủ nghĩa duy vật siêu hình cận đại; Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật mộc mạc, chất phác cỗ đại; Chủ nghĩa duy vật tắm thường; Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy kinh tế; Chủ nghĩa duy vật siêu hình; Chủ nghĩa duy vật biện chứng."],"answer":1,"certainty":"pdf_highlight"},{"n":10,"q":"Chọn đáp án đứng nhất:","options":["Triết học Mác - Lênin là sự thống nhất của thế giới quan duy tâm và nhân sinh quan khoa học.","Triết học Mác - Lênin là sự thống nhất của thế giới quan duy vật và phương pháp luận biện chứng","Triết học Mác - Lênin là sự thống nhất của thế giới quan duy vật và khoa học tự nhiên.","Triết học Mác - Lênin là sự thống nhất của triết học và các khoa học cụ thể."],"answer":1,"certainty":"pdf_highlight"},{"n":11,"q":"Mặt thứ nhất của vẫn để cơ bản của triết học là:","options":["Con người có khả năng nhận thức được thế giới hay không?","Giữa vật chất và ý thức, cái nào có trước, cái nào có sau, cái nào quyết định cái nào?","Ý thức quyết định vật chất","Vật chất và ý thức cùng song song tồn tại"],"answer":1,"certainty":"pdf_highlight"},{"n":12,"q":"Mặt thứ hai của vấn đề cơ bán của triết học là:","options":["Con người có khả năng nhận thức được thế giới hay không?","Bản chất của thế giới là vật chất hay ý thức?","Ý thức quyết định vật chất","Vật chất và ý thức cùng song song tổn tại"],"answer":0,"certainty":"pdf_highlight"},{"n":13,"q":"Chủ hất thành cái bản chất.","Chỉ dựa vào một số mặt, một số mối liên hệ nào đó của sự vật để đưa ra kết luận về sự vật khi chưa có đây đủ thông tin về nó."],"answer":2,"certainty":"pdf_highlight"},{"n":60,"q":"Theo quan điểm triết học Mác- Lênin, điều nào đưới đây không đúng với quan điểm toàn diện:","options":["Khi nhận thức các sự vật, hiện tượng phải xem xét tất cả các mặt, các mối liên hệ trong sự tác động qua lại vốn có.","Phải giữ nguyên các mối liên hệ của mỗi sự vật, không được thay đổi vai trò, vị trí của chúng trong mọi trường hợp.","Phải biết phân biệt từng mối liên hệ.","Phải lưu ý tới sự chuyển hóa lẫn nhau giữa các mối liên hệ ở những điều kiện xác định."],"answer":1,"certainty":"pdf_highlight"},{"n":61,"q":"Theo quan điểm triết học Mác- Lênin, điều nào dưới đây không đúng với quan điểm về sự phát triển:","options":["Yếu tổ quyết định sự phát triển là môi trường khách quan, bên ngoài.","Sự phát triển là kết quả của quá trình thay đổi dẫn dẫn về lượng dẫn đến sự thay đổi về chất và ngược lại.","Sự phát triển có thể bao gồm những bước lùi tạm thời.","Sự phát triển dẫn đến sự vật dường như quay vẻ điểm khởi đầu nhưng trên cơ sở cao hơn."],"answer":0,"certainty":"pdf_highlight"},{"n":62,"q":"Trong số những phạm trù dưới đây, phạm trù nào không phải là phạm trù của phép biện chứng duy vật:","options":["Chất","Lượng","Vận tốc","Vận động"],"answer":2,"certainty":"pdf_highlight"},{"n":63,"q":"Trong những quan điểm sau, quan điểm nào không phải là quan điểm của triết học Mác - Lênin về phạm trù:","options":["Phạm trù được hình thành trong quá trình hoạt động nhận thức và thực tiễn.","Phạm trù là những bậc thang của quá trình nhận thức.","Phạm trù là hình ảnh chủ quan của thế giới khách quan.","Phạm trù có sẵn trong bản thân con người một cách bẩm sinh."],"answer":3,"certainty":"pdf_highlight"},{"n":64,"q":"Trong Bút ký triết học, V .1.Lênin nhận xét rằng dù người ta bắt đầu bằng bất cứ mệnh đề đơn gián nào, chẳng hạn, bất đầu bằng những mệnh để đơn giản nhất, quen thuộc nhất như “lvan là một người”, “Giutsơca” là con chó”,...thì ngay ở đó người ta đã thấy có phép biện chứng rồi. Hãy cho biết, nhận xét trên của V .I.Lênin nói về mối liên hệ giữa 2 phạm trù nào dưới đây:","options":["Bản chất và hiện tượng","Nội dung và hình thức","Cái riêng và cái chung","Tất nhiên và ngẫu nhiên"],"answer":2,"certainty":"pdf_highlight"},{"n":65,"q":"Trong những quan điểm dưới đây về mối quan hệ giữa cái riêng và cái chung, quan điểm nào là của triết học Mác — Lênin:","options":["Cái chung tổn tại độc lập, không phụ thuộc vào cái riêng và sinh ra cái riêng.","Cái riêng chỉ tổn tại trong một thời gian nhất định, còn cái chung tổn tại vĩnh viễn.","Chi có cái riêng tổn tại thực sự, còn cái chung chỉ là những tên gọi do lý trí đặt ra, không phản ánh một cái gì có trong hiện thực.","Cái riêng chỉ tổn tại trong mối quan hệ với cái chung, không có cái riêng tồn tại độc lập tuyệt đối tách rời cái chung."],"answer":3,"certainty":"pdf_highlight"},{"n":66,"q":"Theo quan điểm triết học Mác - Lênin, cái mới xuất hiện dưới dạng nào đưới đây:","options":["Cái chung","Cái riêng","Cái đơn nhất","Cái phổ biến"],"answer":2,"certainty":"pdf_highlight"},{"n":67,"q":"Trong những nội dung dưới đây, nội dung nảo thể hiện quan điểm triết học Mác - Lênin về mối quan hệ giữa nguyên nhân và kết quả:","options":["Một nguyên nhân có thể sinh ra một hoặc nhiều kết quả.","Mối quan hệ giữa nguyên nhân và kết quá lệ thuộc vào ý muốn chủ quan của con người.","Khái niệm nguyên nhân và kết quá chỉ là những ký hiệu mà con người dùng để ghỉ những cảm giác của mình.","Trong sự vận động của thế giới vật chất, có nguyên nhân đầu tiên và kết quả cuối cùng."],"answer":0,"certainty":"pdf_highlight"},{"n":68,"q":"Nội dung sau thể hiện tính chất gì của mỗi liên hệ nhân — quả: “tất cả mọi hiện tượng trong tự nhiên và trong xã hội đều được gây ra bởi những nguyên nhân nhất định, không có hiện tượng nào là không có nguyên nhân”.","options":["Tính khách quan","Tính phổ biến","Tính tắt yếu","Tính đa dạng, phong phú."],"answer":1,"certainty":"pdf_highlight"},{"n":69,"q":"Những nguyên nhân mà sự có mặt của chúng chỉ quyết định những đặc điểm nhất thời, không ổn định, cá biệt của hiện tượng được gọi là nguyên nhân gì?","options":["Nguyên nhân khách quan","Nguyên nhân bên trong","Nguyên nhân chủ yếu","Nguyên nhân thứ yếu"],"answer":3,"certainty":"pdf_highlight"},{"n":70,"q":"Cái đo những nguyên nhân cơ bản, bên trong của kết cấu vật chất quyết định và trong những điều kiện nhất định phải xảy ra đúng như thế chứ không thể khác được gọi là gì:","options":["Bản chất","Kết quả","Tất nhiên","Đơn nhất"],"answer":2,"certainty":"pdf_highlight"},{"n":71,"q":"Dựa trên quan điểm của triết học Mác - Lênin về cái chung và cái tất nhiên, hãy cho biết trong số 4 ý kiến sau, ý kiến nào đúng.","options":["Phạm trù cái chung và phạm trù tắt nhiên hoàn toàn đồng nhất với nhau.","Phạm trù cái chung rộng hơn phạm trù tất nhiên","Phạm trù cái chung hẹp hơn phạm trủ tất nhiên","Phạm trù cái chung hoàn toàn khác biệt phạm trù tất nhiên."],"answer":1,"certainty":"pdf_highlight"},{"n":72,"q":"Trong một cuộc tranh luận, khi bàn về nguyên nhân của cái ngẫu nhiên, 4 nhóm sinh viên đã đưa ra 4 ý kiến khác nhau. Hãy cho biết, trong 4 ý kiến dưới đây, ý kiến nào đúng?","options":["Ngẫu nhiên là cái do những nguyên nhân cơ bản, bên trong của kết cấu vật chất quyết định.","Ngẫu nhiên là cái do những nguyên nhân bên ngoài, đo sự ngẫu hợp của nhiều hoàn cảnh bên ngoài quyết định.","Ngẫu nhiên là cái vừa do những nguyên nhân bên trong, vừa do nguyên nhân bên ngoài quyết định.","Tất cả các phương án trả lời trên (A, B, C) đều sai."],"answer":1,"certainty":"pdf_highlight"},{"n":73,"q":"Trong số các quan điểm sau, quan điểm nào là quan điểm của triết học Mác - Lênin về cái tất nhiên và ngẫu nhiên:","options":["Phủ nhận tính khách quan của cái tắt nhiên và ngẫu nhiên","Thừa nhận tính khách quan của cái tất nhiên nhưng không thừa nhận tính khách quan của cái ngẫu nhiên","Thừa nhận tính khách quan của cái ngẫu nhiên nhưng không thừa nhận tính khách quan của cái tắt nhiên","Cả cái tất nhiên và cái ngẫu nhiên đều có tính khách quan"],"answer":3,"certainty":"pdf_highlight"},{"n":74,"q":"Trong một buổi thảo luận, khi bàn về vai trò của cái tất nhiên và ngẫu nhiên đối với sự vận động phát triển của sự vật, 4 nhóm sinh viên đã đưa ra 4 ý kiến như sau. Hãy cho biết ý kiến nào đúng?","options":["Cái ngẫu nhiên quyết định sự tổn tại, phát triển của sự vật","Cái tất nhiên quyết định sự tồn tại, phát triển của sự vật","Cá cái tắt nhiên và cái ngẫu nhiên đều quyết định sự tổn tại, phát triển của sự vật .","Cả cái tất nhiên và ngẫu nhiên đều không quyết định sự tổn tại, phát triển của sự vật."],"answer":1,"certainty":"pdf_highlight"},{"n":75,"q":"Tổng hợp tất cả những mặt, những yếu tố, những quá trình tạo nên sự vật, được triết học Mác - Lênin gọi là gì:","options":["Chất","Bản chất","Nội dung","Lượng"],"answer":2,"certainty":"pdf_highlight"},{"n":76,"q":"Trong số những ý kiến sau về bản chất và quy luật, cách diễn đạt nào đúng với quan điểm của triết học Mác - Lênin:","options":["Bản chất và quy luật là những phạm trù cùng bậc, nhưng chúng không hoàn toàn đồng nhất với nhau.","Bản chất và quy luật là những phạm trù cùng bậc và chúng hoàn toàn đồng nhất với nhau.","Bản chất và quy luật là những phạm trù không cùng bậc và cũng không đồng nhất với nhau.","Tắt cả các ý kiến trên đều sai."],"answer":0,"certainty":"pdf_highlight"},{"n":77,"q":"“Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên tương đối ôn định ở bên trong sự vật, quy định sự vận động và phát triển của sự vật được gọi là gì?","options":["Nội dung","Quy luật","Bản chất","Tắt nhiên"],"answer":2,"certainty":"pdf_highlight"},{"n":78,"q":"“Trong xã hội có giai cấp, bất kỳ nhà nước nào cũng là bộ máy trấn áp của giai cấp này đối với giai cấp khác. Điều đó thể hiện ở chỗ, bất kỳ nhà nước nào cũng có quân đội, cảnh sát, tòa án, nhà tù,...\". Hãy cho biết, nội dung này là một trong những biểu hiện trên thực tế của mối quan hệ giữa 2 phạm trù nào dưới đây:","options":["Tắt nhiên — ngẫu nhiên","Nguyên nhân — kết quả","Bản chất — hiện tượng","Nội dung — hình thức"],"answer":2,"certainty":"pdf_highlight"},{"n":79,"q":"Dựa trên quan điểm của triết học Mác - Lênin về cặp phạm trù bản chất và hiện tượng, hãy cho biết, trong những nội dung dưới đây, nội dung nào đúng.","options":["Hiện tượng biến đổi nhanh hơn so với bản chất.","Hiện tượng biến đổi chậm hơn so với bản chất,","Hiện tượng không phụ thuộc vào bản chất.","Tắt cả cá các nội dung trên đều sai."],"answer":0,"certainty":"pdf_highlight"},{"n":80,"q":"Dựa trên mối quan hệ biện chứng giữa khả năng và hiện thực, triết học Mác - Lênin đã rút ra ý nghĩa phương pháp luận nào dưới đây:","options":["Trong hoạt động thực tiễn, cẩn căn cứ trước hết vào khá năng.","Trong hoạt động thực tiễn, cần căn cứ trước hết vào hiện thực, đồng thời phải tính đến các khả năng.","Trong hoạt động thực tiễn, cần căn cứ trước hết vào hiện thực, không cần tính đến các khả năng.","Trong hoạt động thực tiễn, chỉ cần căn cứ vào khả năng, không cẩn căn cứ vào hiện thực."],"answer":1,"certainty":"pdf_highlight"},{"n":81,"q":"V .I.Lênin cho rằng: “Người mácxít chỉ có thể sử dụng, để làm căn cứ cho chính sách của mình, những sự thật được chứng minh rõ rệt và không thể chối cãi được”. Bạn hãy cho biết, trong câu trích này, V .I.Liênin nhắn mạnh các chính sách phải dựa vào cái gì:","options":["Cái chung","Hiện thực","Tất nhiên","Bản chất"],"answer":1,"certainty":"pdf_highlight"},{"n":82,"q":"Phép biện chứng duy vật nghiên cửu những quy luật phổ biến tác động trong các lĩnh vực nào đưới đây:","options":["Lĩnh vực tự nhiên","Lĩnh vực xã hội","Lĩnh vực tư duy của con người","Tất cả các lĩnh vực trên"],"answer":3,"certainty":"pdf_highlight"},{"n":83,"q":"Loại quy luật “nói lên mối liên hệ nôi tại của những khái niệm, phạm trù, những phán đoán nhờ đó trong tư tưởng của con người hình thành trí thức nào đó về sự vật” là loại quy luật nào trong số các quy luật dưới đây:","options":["Quy luật tự nhiên","Quy luật xã hội","Quy luật của tư đuy","Quy luật riêng"],"answer":2,"certainty":"pdf_highlight"},{"n":84,"q":"Trong những quan niệm sau, quan niệm nào là quan niệm của triết học Mác - Lênin về thuộc tính:","options":["Thuộc tính là những tính chất của sự vật, là cái vốn có của sự vật.","Thuộc tính là những tính chất không phải là tính chất vốn có của sự vật.","Mỗi sự vật chỉ có đuy nhất một thuộc tính.","Thuộc tính là biểu hiện của những chất bị che giấu."],"answer":0,"certainty":"pdf_highlight"},{"n":85,"q":"Điểm giới hạn mà tại đó sự thay đổi về lượng sẽ làm thay đổi chất của sự vật được gọi là gì:","options":["Bước nhảy đột biến","Bước nháy dẫn dần","Bước quá độ","Điểm nút"],"answer":3,"certainty":"pdf_highlight"},{"n":86,"q":"Mâu thuẫn biện chứng là:","options":["Sự không nhất quán trong tư duy","Sự thống nhất của các mặt đối lập bên trong các sự vật, hiện tượng hoặc giữa các sự vật hiện, tượng.","Sự bù trừ lẫn nhau của các mặt đối lập","Sự thống nhất và đấu tranh của các mặt đối lập trong các sự vật hiện tượng hoặc giữa các sự vật, hiện tượng với nhau."],"answer":1,"certainty":"pdf_highlight"},{"n":87,"q":"Khi chúng ta nhúng một thanh sắt đã nung đỏ vào chậu nước lạnh thì nhiệt độ của nước ở trong chậu tăng lên. Song sự tăng nhiệt độ của nước ở trong chậu, đến lượt mình, lại kìm hãm tốc độ tỏa nhiệt của sắt. Hãy cho biết, tình huống trên thể hiện nội dung nào dưới đây:","options":["Nguyên nhân sinh ra kết quả nhưng sau khi xuất hiện, kết quả ảnh hưởng trở lại đối với nguyên nhân.","Bản chất sinh ra hiện tượng nhưng sau khi xuất hiện, hiện tượng ảnh hưởng trở lại đối với bản chất.","Nội dung sinh ra hình thức nhưng sau khi xuất hiện, hình thức ảnh hưởng trở lại đối với nội dung.","Hiện thực sinh ra khả năng nhưng sau khi xuất hiện, khả năng ảnh hưởng trở lại đối với biện thực."],"answer":0,"certainty":"pdf_highlight"},{"n":88,"q":"Ph.Ăngghen viết: “việc Napôlêðông chính là nhà độc tài quân sự mả nền cộng hòa Pháp hết sức cần đến là một việc hoàn toàn ngẫu nhiên. Đã có nhiều bằng chứng chứng tỏ rằng, nếu không có Napôlêông thì sẽ có một người khác thể chỗ ông ta, vì mỗi khi cẦn đến một người như thế trong lịch sử thì người đó sẽ xuất hiện”. Đoạn trích trên thể hiện quan điểm của triết học Mác - Lênin về nội dung nào dưới đây:","options":["Cái tắt nhiên và cái ngẫu nhiên có thể chuyển hóa cho nhau","Cái tắt nhiên và cái ngẫu nhiên hoàn toàn tách rời nhau.","Cái tắt nhiên và cái ngẫu nhiên loại trừ lẫn nhau.","Cái tất nhiên bao giờ cũng vạch đường đi cho mình thông qua vô số cái ngẫu nhiên, còn cái ngẫu nhiên là hình thức biểu hiện của cái tất nhiên."],"answer":3,"certainty":"pdf_highlight"},{"n":89,"q":"Khi ta nhúng một nửa cái thước vào chậu nước, nhìn vào ta thấy cái thước bị gấp khúc, trong khi đó sự thực cái thước vẫn thẳng. Tình huống trên thể hiện quan điểm triết học Mác - Lênin về nội dung nào dưới đây:","options":["Hiện tượng thay đổi nhanh hơn bản chất,","Bản chất thay đổi thì hiện tượng cũng thay đổi theo.","Hiện tượng phản ánh sai lệch bản chất.","Bản chất sâu sắc hơn hiện tượng."],"answer":2,"certainty":"pdf_highlight"},{"n":90,"q":"Bản chất bóc lột giá trị thặng đư của giai cấp tư sản được biểu hiện qua nhiều hiện tượng khác nhau, chẳng hạn như: nhà tư bản ngày cảng giàu có; công nhân có thu nhập thấp và cuộc sống ngày càng khó khăn; nhiễu phong trào dấu tranh của giai cấp công nhân diễn ra; bất bình đẳng xã hội tăng lên;… Tình huỗng trên cho phép chúng ta rút ra kết luận nào dưới đây:","options":["Hiện tượng sâu sắc hơn bản chất","Hiện tượng phong phú hơn bản chất","Hiện tượng quan trọng hơn bản chất","Bản chất là bất biến"],"answer":1,"certainty":"pdf_highlight"},{"n":91,"q":"Khi ta gieo một đồng tiền kim loại hoàn toàn đối xứng xuống đất thì khả năng xuất hiện một trong 2 mặt của đồng tiền là khả năng gì:","options":["Khả năng chủ yếu","Khả năng thứ yếu","Khả năng tắt nhiên","Khả năng ngẫu nhiên"],"answer":2,"certainty":"pdf_highlight"},{"n":92,"q":"Trong lịch sử triết học, do ồn tại xã hội."],"answer":3,"certainty":"pdf_highlight"},{"n":289,"q":"Trong số các biểu hiện trước đây, biểu hiện nào là quan trọng nhất của tính độc lập tương đối của ý thức xã hội:","options":["Ý thức xã hội thường lạc hậu hơn so với tồn tại xã hội","Ý thức xã hội tác động trở lại tồn tại xã hội.","Ý thức xã hội có thể vượt trước tổn tại xã hội","Ý thức xã hội có tính kế thừa trong sự phát triển"],"answer":1,"certainty":"pdf_highlight"},{"n":290,"q":"Chủ nghĩa Mác - Lênin, tư tưởng Hỗ Chí Minh phải trở thành nền tảng tư tưởng và kim chỉ nam cho hành động. Đây là đòi hỏi trực tiếp của quá trinh:","options":["Xây dựng nhà nước xã hội chủ nghĩa","Xây dựng quan hệ sản xuất xã hội chủ nghĩa","Xây dựng kiến trúc thượng tắng xã hội chủ nghĩa","Xây dựng lực lượng sản xuất xã hội chủ nghĩa"],"answer":2,"certainty":"pdf_highlight"},{"n":291,"q":"Nhận định nào dưới đây không phải của triết học Mác- Lênin:","options":["Con người là một thực thể thống nhất giữa mặt sinh vật với mặt xã hội.","Con người bản chất là thiện, điều xấu do bị ảnh hưởng phong tục tập quán, do ảnh hưởng của môi trường xã hội.","Trong tính hiện thực của nó, bản chất con người là tổng hòa các quan hệ xã hội.","Con người là sản phẩm của lịch sử và là chủ thể của xã hội."],"answer":1,"certainty":"pdf_highlight"},{"n":292,"q":"Trong số các hình thái ý thức xã hội sau, hình thái ý thức nào thể hiện trực tiếp và tập trung nhất lợi ích giai cấp:","options":["Ý thức pháp quyền","Ý thức chính trị","Ý thức đạo đức","Ý thức tôn giáo"],"answer":1,"certainty":"pdf_highlight"},{"n":293,"q":"Nội dung nào dưới đây không phải là nguyên nhân gây nên sự lạc hậu của ý thức xã hội đối với tôn tại xã hội?","options":["Do sự biến đỗi của tổn tại xã hội thường diễn ra với tốc độ nhanh mà ý thức xã hội có thể không phản ánh kịp và trở nên lạc hậu.","Do ý thức xã hội có tính vượt trước","Do sức mạnh của thói quen, truyền thống, tập quán cũng như do tính lạc hậu, bảo thủ của một số hình thái ý thức xã hội .","Do Những tư tưởng cũ, lạc hậu thường được các lực lượng phản tiến bộ lưu giữ và truyền bá nhằm chống lại các lực lượng tiến bộ."],"answer":1,"certainty":"pdf_highlight"},{"n":294,"q":"“Lịch sử xã hội cho thấy, nhiều khi xã hội cũ đã mất đi, thậm chí đã mắt rất lâu, nhưng ý thức xã hội do xã hội đó sinh ra vẫn tôn tại dai đẳng”. Nội dung trên là biểu hiện nào của tính độc lập tương đối của ý thức xã hội?","options":["Ý thức xã hội thường lạc hậu hơn sự phát triển của tổn tại xã hội","Sự tác động qua lại lẫn nhau giữa các hình thái ý thức xã hội","Tính kế thừa trong quá trình phát triển của các hình thái ý thức xã hội","Ý thức xã hội có thể vượt trước tôn tại xã hội"],"answer":0,"certainty":"pdf_highlight"},{"n":295,"q":"Hình thái ý thức xã hội “phản ánh các quan hệ chính trị, kình tế, xã hội giữa các giai cấp, các dân tộc và các quốc gia, cũng như thái độ của các giai cấp đối với quyền lực nhà nước” là hình thái ý thức xã hội gì?","options":["Ý thức pháp quyền","Ý thức khoa học","Ý thức chính trị","Ý thức kinh tế"],"answer":2,"certainty":"pdf_highlight"},{"n":296,"q":"Hình thái ý thức xã hội nào phản ánh tổn tại xã hội đưới dạng các quy tắc điều chỉnh (bằng dư luận xã hội) hành vi của con người?","options":["Ý thức thẩm mỹ","Ý thức đạo đức","Ý thức tôn giáo","Ý thức pháp quyển"],"answer":1,"certainty":"pdf_highlight"},{"n":297,"q":"Trong số các hình thái ý thức xã bội sau, hình thái ý thức nào ra đời từ khi xã hội chưa phân chia thành giai cắp?","options":["Ý thức chính trị","Ý thức pháp quyền","Ý thức thâm mỹ","Cả A, B và C"],"answer":2,"certainty":"pdf_highlight"},{"n":298,"q":"“Toàn bộ những biểu tượng, tỉnh cảm, tâm trạng, thói quen của quản chúng về tín ngưỡng tôn giáo” được gọi là gì?","options":["Tâm ly tôn giáo","Hệ tư tưởng tôn giáo","Ý thức tôn giáo","Giáo lý"],"answer":0,"certainty":"pdf_highlight"},{"n":299,"q":"“Những tri thức, quan niệm của con người hình thành một cách trực tiếp trong hoạt động hàng ngày, chưa được hệ thống hóa, khái quát hóa” được gọi là gì?","options":["Hệ tư tưởng","Ý thức xã hội thông thường","Ý thức lý luận","Cả A, B và C"],"answer":1,"certainty":"pdf_highlight"},{"n":300,"q":"Tính giai cấp của ý thức xã hội biểu hiện ở:","options":["Tâm lý xã hội","Hệ tư tưởng","Cả tâm lý xã hội và hệ tư tưởng","Cả A, B và C đều sai"],"answer":2,"certainty":"pdf_highlight"},{"n":301,"q":"Hãy chỉ ra quan điểm của chủ nghĩa duy vật biện chứng về bản chất của ý thức:","options":["Ý thức là một đạng vật chất","Ý thức là một thực thể độc lập","Ý thức là sự phản ánh năng động, sáng tạo thể giới khách quan vào bộ não con người","Cả 3 phương án A,B,C"],"answer":2,"certainty":"pdf_highlight"},{"n":302,"q":"Sự đấu tranh giữa các mặt đối lập là","options":["Tạm thời","Tương đối","Tuyệt đối","Thoáng qua"],"answer":2,"certainty":"pdf_highlight"}];let order=data.map((_,i)=>i),pos=0,shuffleAnswers=false,reveal=false,chosen=JSON.parse(localStorage.getItem('macLeninProgress')||'{}'),filterMode='all';const letters=['A','B','C','D'];function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function current(){return data[order[pos]]}function status(d){if(chosen[d.n]===undefined)return 'todo';if(d.answer===null)return 'ungraded';return chosen[d.n]===d.answer?'done':'failed'}function renderList(){let g=document.getElementById('qgrid');g.innerHTML='';data.forEach((d,i)=>{if(filterMode==='wrong'&&status(d)!=='failed')return;if(filterMode==='todo'&&status(d)!=='todo')return;let b=document.createElement('button');b.className='qjump '+status(d)+(order[pos]===i?' active':'');b.textContent=d.n;b.title='Câu '+d.n+(status(d)==='failed'?' · Sai':status(d)==='done'?' · Đúng':status(d)==='ungraded'?' · Chưa chấm':' · Chưa làm');b.onclick=()=>{let k=order.indexOf(i);if(k<0){filterMode='all';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));order=data.map((_,j)=>j);k=i}pos=k;render()};g.appendChild(b)})}function render(){let d=current();if(!d)return;document.getElementById('count').textContent=`Câu ${pos+1}/${order.length} · ${Object.values(chosen).filter((v,i)=>{let d=data.find(x=>x.n===+Object.keys(chosen)[i]);return d&&d.answer!==null&&v!==d.answer}).length} câu sai`;renderList();let perm=d.perm||[0,1,2,3];let ans=d.answer;let selected=chosen[d.n];let html=`<div class="row"><span class="number">CÂU ${d.n}</span><span>${d.answer===null?'Chưa xác định đáp án': 'Ôn tập'}</span></div><div class="q">${esc(d.q)}</div><div class="options">`;perm.forEach((orig,i)=>{let cls='option';if((reveal||selected!==undefined)&&orig===ans)cls+=' correct';if(selected===orig&&orig!==ans)cls+=' wrong';html+=`<button class="${cls}" data-i="${orig}"><span class="letter">${letters[i]}</span><span>${esc(d.options[orig])}</span></button>`});html+='</div>';if(selected!==undefined)html+=`<div class="explain">${ans===null?'Câu này chưa được chấm vì PDF không có dấu vàng nhận diện.':selected===ans?'Đúng rồi!':`Câu sai. Đáp án đúng: ${letters[perm.indexOf(ans)]}.`}</div>`;else if(reveal)html+=`<div class="explain">${ans===null?'Không tìm thấy dấu vàng cho câu này trong PDF.':'Đáp án đúng được tô vàng.'} Dấu vàng được lấy trực tiếp từ PDF.</div>`;html+=`<div class="nav"><button class="btn" id="prev">← Câu trước</button><button class="btn primary" id="next">Câu tiếp →</button></div><div class="bottom">Chọn một phương án để kiểm tra. Thứ tự câu hỏi và lựa chọn được xáo trộn độc lập.</div>`;document.getElementById('card').innerHTML=html;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{chosen[d.n]=+b.dataset.i;localStorage.setItem('macLeninProgress',JSON.stringify(chosen));render()});document.getElementById('prev').onclick=()=>{pos=(pos-1+order.length)%order.length;render()};document.getElementById('next').onclick=()=>{pos=(pos+1)%order.length;render()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('shuffleQ').onclick=()=>{order=mix(order.slice());pos=0;render()};document.getElementById('shuffleA').onclick=()=>{shuffleAnswers=true;data.forEach(d=>d.perm=mix([0,1,2,3]));chosen={};render()};document.getElementById('showAll').onclick=()=>{reveal=!reveal;document.getElementById('showAll').textContent=reveal?'Ẩn đáp án':'Hiện đáp án';render()};document.getElementById('reset').onclick=()=>{order=data.map((_,i)=>i);data.forEach(d=>delete d.perm);pos=0;chosen={};reveal=false;document.getElementById('showAll').textContent='Hiện đáp án';render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filterMode=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderList()});document.getElementById('clearProgress').onclick=()=>{chosen={};localStorage.removeItem('macLeninProgress');render()};document.getElementById('search').oninput=e=>{let v=e.target.value.trim().toLocaleLowerCase('vi');order=data.map((d,i)=>({d,i})).filter(x=>(x.d.q+' '+x.d.options.join(' ')).toLocaleLowerCase('vi').includes(v)).map(x=>x.i);pos=0;render()};render();</script></body></html>
